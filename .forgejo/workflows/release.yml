name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release"
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || forge.ref_name }}

      - name: Resolve built SHA
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl, aarch64-unknown-linux-musl

      - uses: https://github.com/Swatinem/rust-cache@v2

      - name: Install zig
        uses: https://github.com/mlugg/setup-zig@v2

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild

      - name: Build both targets
        run: |
          cargo zigbuild --release --target x86_64-unknown-linux-musl
          cargo zigbuild --release --target aarch64-unknown-linux-musl

      - name: Stage artifacts
        run: |
          mkdir -p dist/release
          cp target/x86_64-unknown-linux-musl/release/bunnynet_prometheus \
             dist/release/bunnynet_prometheus-x86_64-unknown-linux-musl
          cp target/aarch64-unknown-linux-musl/release/bunnynet_prometheus \
             dist/release/bunnynet_prometheus-aarch64-unknown-linux-musl
          cp /etc/ssl/certs/ca-certificates.crt dist/ca-certificates.crt

      - name: Publish release
        uses: https://code.forgejo.org/actions/forgejo-release@v2
        with:
          direction: upload
          url: ${{ forge.server_url }}
          tag: ${{ inputs.tag || forge.ref_name }}
          release-dir: dist/release
          token: ${{ forge.token }}
          sha: ${{ steps.sha.outputs.sha }}
          override: true

      - name: Build and push image
        env:
          DOCKER_HOST: tcp://172.17.0.1:2375
          TAG: ${{ inputs.tag || forge.ref_name }}
          TOKEN: ${{ forge.token }}
          ACTOR: ${{ forge.actor }}
          SERVER: ${{ forge.server_url }}
          REPO: ${{ forge.repository }}
        run: |
          host="${SERVER#https://}"
          image="$host/$(echo "$REPO" | tr '[:upper:]' '[:lower:]')"
          echo "$TOKEN" | docker login "$host" -u "$ACTOR" --password-stdin
          docker build \
            --build-arg BIN=dist/release/bunnynet_prometheus-x86_64-unknown-linux-musl \
            -t "$image:$TAG" .
          docker push "$image:$TAG"
