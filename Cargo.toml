[package]
name = "bunnynet_prometheus"
version = "0.1.0"
edition = "2024"
authors = ["Emanuel Claesson <emanuel@eclaesson.com>"]
description = "Expose Bunny.net statistics as a scrapable prometheus endpoint."
repository = "https://github.com/EClaesson/bunnynet_prometheus"
license = "MIT"
keywords = ["bunny", "statistics", "prometheus", "metrics"]
categories = ["development-tools"]

[lints.rust]
future_incompatible = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
nonstandard_style = { level = "warn", priority = -1 }
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
cargo = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
expect_used = "warn"
multiple_crate_versions = "allow"
panic = "warn"
print_stderr = "warn"
print_stdout = "warn"
ptr_arg = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"

[profile.release]
lto = true
opt-level = 3
debug = false
strip = true
codegen-units = 1
panic = "abort"

[dependencies]
anyhow = { version = "1.0.102" }
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive", "cargo"] }
metrics = { version = "0.24.5" }
metrics-exporter-prometheus = { version = "0.18.3", default-features = false, features = [
    "http-listener",
] }
reqwest = { version = "0.13.3", features = ["json"] }
reqwest-middleware = { version = "0.5.1" }
reqwest-retry = { version = "0.9.1" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149" }
shellexpand = { version = "3.1.2" }
tokio = { version = "1.52.3", features = [
    "rt-multi-thread",
    "macros",
    "signal",
] }
tracing = { version = "0.1.44" }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
